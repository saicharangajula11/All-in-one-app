<meta name="theme-color" content="#c90018">
<title>All in One — Personal Library</title>
<style>
:root{--bg:#fff;--panel:#fff;--panel2:#fff5f5;--text:#211315;--muted:#7d6568;--line:#efd4d7;--accent:#d00020;--accent2:#bd001d;--danger:#c90018}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.app{max-width:1280px;margin:auto;padding:22px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;position:relative}.brand h1{color:#c90018}.brand:focus,.brand:focus-visible{outline:none}.logo{width:66px;height:66px;border-radius:50%;object-fit:cover;border:2px solid #d00020;box-shadow:0 3px 12px #c9001822;display:block}
h1{font-size:23px;margin:0;letter-spacing:-.6px}.subtitle{color:var(--muted);font-size:12px}.header-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:10px 14px;border-radius:11px;background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.primary{background:var(--accent);color:#fff;font-weight:750;border-color:transparent}.btn:hover{filter:brightness(1.1)}
.hero{border:1px solid var(--line);border-radius:22px;padding:24px;background:#fff7f7;margin-bottom:20px}
.hero h2{font-size:clamp(24px,4vw,36px);margin:0 0 7px;letter-spacing:-1px}.hero p{color:var(--muted);margin:0 0 18px}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#ffffff0a;border:1px solid #ffffff10;border-radius:12px;padding:10px 14px;min-width:100px}.stat strong{display:block;font-size:20px}.stat span{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.search{flex:1;min-width:200px}.field{width:100%;background:#fff;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:none}.field:focus{border-color:var(--accent)}select.field{min-width:145px;width:auto}
.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}.tab{white-space:nowrap;padding:10px 14px;border-radius:12px;background:transparent;color:var(--muted);border:1px solid transparent}.tab.active{background:#fff0f1;border-color:#d0002055;color:#c0001d}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 0 14px}.section-head h2{margin:0;font-size:20px}.count{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.poster-card{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:17px;cursor:pointer;min-width:0;transition:transform .15s,border-color .15s}.poster-card:hover{transform:translateY(-2px);border-color:#7770aa}
.poster{aspect-ratio:2/2.8;background:linear-gradient(145deg,#ffe8eb,#fff);position:relative;overflow:hidden}.poster img{width:100%;height:100%;object-fit:cover;display:block}.poster-placeholder{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12px;background:linear-gradient(145deg,#fff0f1,#ffe0e4);color:#b0001b}.poster-placeholder strong{font-size:clamp(15px,2.5vw,24px);line-height:1.1;overflow-wrap:anywhere}.type-pill{position:absolute;top:9px;right:9px;background:#080a12d9;border:1px solid #ffffff25;border-radius:8px;padding:4px 7px;font-size:10px;text-transform:uppercase;letter-spacing:.7px}
/* Remove the black type rectangle at the top-right of posters. */
.type-pill{display:none!important}.imdb-badge{position:absolute;top:9px;left:9px;display:inline-flex;align-items:center;gap:5px;background:rgba(8,8,8,.94);color:#fff;border:1px solid #ffffff20;border-radius:9px;padding:5px 8px;font-size:12px;font-weight:800;box-shadow:0 2px 7px #0005}.imdb-logo{background:#f5c518;color:#111;border-radius:3px;padding:2px 4px;font-size:10px;font-weight:950;letter-spacing:-.5px}.poster-info{padding:10px 11px}.poster-title{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.poster-meta{font-size:12px;color:var(--muted);margin-top:3px}.poster-url{display:inline-block;max-width:100%;color:var(--accent);text-decoration:underline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.empty{padding:42px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:5px}
.list{display:grid;gap:8px}.link-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 12px;min-width:0}.link-row .name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.link-row a{color:var(--accent);font-size:12px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:auto;max-width:55%}.link-row .row-actions{display:flex;gap:5px}.small-btn{background:transparent;color:var(--muted);padding:4px 6px;border-radius:6px}.small-btn:hover{background:#ffffff12;color:var(--text)}
.notes-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.note{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px}.note h3{margin:0 0 7px;font-size:15px}.note p{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);margin:0;font-size:13px}
.modal-backdrop{position:fixed;inset:0;background:#05060bdc;display:none;align-items:center;justify-content:center;padding:16px;z-index:10;overflow:auto}.modal-backdrop.show{display:flex}.modal{width:min(760px,100%);max-height:94vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 20px 80px #0008}.modal-top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}.modal h2{margin:0;font-size:21px}.close{background:#c90018;color:white;border-radius:9px;padding:7px 10px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-field{display:flex;flex-direction:column;gap:5px}.form-field label{color:var(--muted);font-size:12px}.span2{grid-column:span 2}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}.detail-layout{display:grid;grid-template-columns:180px 1fr;gap:18px}.detail-poster{width:100%;aspect-ratio:2/2.8;object-fit:cover;border-radius:12px;background:#fff0f1}.detail-info p{color:var(--muted);white-space:pre-wrap}.detail-description{margin:8px 0!important}.detail-link{margin:8px 0!important;overflow-wrap:anywhere}.detail-link a{color:var(--accent);text-decoration:underline;overflow-wrap:anywhere}.detail-actions{display:flex;gap:10px;margin-top:18px}.detail-actions .btn{flex:1;min-width:0}.detail-actions #detailDelete{color:#c90018;border-color:#e8b8bf}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{font-size:11px;background:#fff0f1;color:#b0001b;border:1px solid #f0c5cb;border-radius:20px;padding:4px 8px}.episode-block{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.episode{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #ffffff0b}.episode a{color:var(--accent);text-decoration:none}.hidden{display:none!important}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#fff0f1;color:#8b0015;border-radius:12px;padding:11px 16px;font-weight:700;z-index:30;display:none;box-shadow:0 8px 30px #0005}.toast.show{display:block}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.app{padding:30px}.notes-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:520px){.app{padding:14px}.hero{padding:18px}.form-grid{grid-template-columns:1fr}.span2{grid-column:span 1}.detail-layout{grid-template-columns:110px 1fr;gap:12px}.btn{padding:9px 11px}.link-row a{max-width:40%}}

/* All in One red-and-white layout */
.header-actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.backup-menu{display:none;position:absolute;top:74px;left:0;z-index:20;background:#fff;border:1px solid #e8b8bf;border-radius:12px;padding:8px;box-shadow:0 8px 24px #8d001522;min-width:175px}.backup-menu.show{display:grid;gap:7px}.backup-menu .btn{width:100%;text-align:left}.section-menu{display:none;flex-wrap:wrap;gap:6px;margin:10px 0 14px;padding:10px;border:1px solid #efd4d7;border-radius:14px;background:#fffafa}.section-menu.show{display:flex}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(115px,.7fr) minmax(125px,.75fr);gap:8px;align-items:center;margin:14px 0}.toolbar .search{min-width:0}.toolbar select.field{min-width:0;width:100%}.pagination{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px 0}.pagination .btn:disabled{opacity:.35;cursor:default}.page-label{font-size:13px;color:var(--muted)}.section-head{margin-top:12px}.poster-card{border-radius:12px}.poster-info{padding:6px 8px}.poster-title{font-size:13px}.poster-meta{font-size:10px}.tabs{display:none}.tabs.show{display:flex}.pdf-preview{width:100%;height:220px;border:1px solid var(--line);border-radius:10px}
@media(max-width:520px){.detail-actions{gap:8px}.detail-actions .btn{padding:10px 8px;font-size:14px}.app{padding:12px}.brand{gap:9px}.logo{width:58px;height:58px}h1{font-size:21px}.subtitle{font-size:11px}.header-actions{width:auto}.toolbar{grid-template-columns:minmax(0,1fr) minmax(90px,.7fr) minmax(105px,.75fr);gap:5px}.toolbar .field{padding:9px 7px;font-size:12px}.grid{gap:8px}.poster-info{padding:5px 6px}.poster-title{font-size:12px}.poster-meta{font-size:9px}.section-menu .tab{padding:8px 9px;font-size:12px}}

/* Compact top-right menu: sections and backup actions live together */
header{position:relative;align-items:center}
.header-actions{margin-left:auto;display:flex;align-items:center;justify-content:flex-end}
.menu-toggle{width:46px;height:44px;border:1px solid #edc6cb;border-radius:12px;background:#fff5f6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;box-shadow:0 2px 8px #c9001810}
.menu-toggle span{display:block;width:21px;height:2.5px;border-radius:2px;background:#c90018}
.brand{cursor:default}
.section-menu{display:none;position:absolute;top:calc(100% - 10px);right:0;left:auto;width:min(330px,calc(100vw - 24px));max-height:70vh;overflow:auto;z-index:25;box-shadow:0 12px 28px #8d001522;background:#fff;border-color:#edc6cb;padding:10px;flex-direction:column;align-items:stretch;gap:5px}
.section-menu.show{display:flex}
.section-menu .tab{display:block;text-align:left;width:100%;padding:11px 12px;border-radius:9px;border:1px solid transparent}
.section-menu .tab.active{background:#fff0f1;border-color:#e6adb5;color:#bd001d}
.menu-divider{height:1px;background:#efd4d7;margin:5px 0}
.section-menu .menu-action{background:#fff8f8;border:1px solid #efd4d7;color:#b9001c;font-weight:650}
@media(max-width:520px){.section-menu{top:calc(100% - 8px);right:0}.header-actions{width:auto}.brand{max-width:calc(100% - 60px)}.subtitle{max-width:65vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}


/* Remove the focus/tap rectangle around the logo and title on mobile. */
.brand,.brand:focus,.brand:focus-visible,.logo{-webkit-tap-highlight-color:transparent;outline:none!important;box-shadow:none;}
.brand{user-select:none;}
.logo{box-shadow:0 3px 12px #c9001822;}

/* Reliable mobile menu fix: keep the dropdown in the viewport, above all content. */
#tabs.section-menu{display:none!important;position:fixed!important;top:118px!important;right:12px!important;left:auto!important;width:min(330px,calc(100vw - 24px))!important;max-height:calc(100dvh - 145px)!important;overflow-y:auto!important;z-index:99999!important;background:#ffffff!important;border:1px solid #d00020!important;border-radius:14px!important;box-shadow:0 16px 40px rgba(90,0,10,.28)!important;padding:10px!important;flex-direction:column!important;}
#tabs.section-menu.show{display:flex!important;visibility:visible!important;opacity:1!important;}
#tabs.section-menu .tab{display:block!important;visibility:visible!important;opacity:1!important;width:100%!important;text-align:left!important;color:#5a1820!important;background:#fff8f8!important;}
#tabs.section-menu .tab.active{background:#ffe8eb!important;color:#bd001d!important;border-color:#e6adb5!important;}
#tabs.section-menu .menu-action{background:#fff0f1!important;color:#b9001c!important;}
#menuToggle{position:relative;z-index:100000!important;touch-action:manipulation;}


/* Final reliable mobile dropdown behaviour */
#menuToggle{cursor:pointer;min-width:48px;min-height:48px;position:relative;z-index:100001!important;-webkit-tap-highlight-color:transparent;}
#tabs.section-menu{display:none!important;visibility:hidden;opacity:0;position:fixed!important;top:calc(env(safe-area-inset-top, 0px) + 125px)!important;right:12px!important;left:auto!important;width:min(340px,calc(100vw - 24px))!important;max-height:calc(100dvh - 150px)!important;overflow-y:auto!important;z-index:100000!important;background:#fff!important;border:2px solid #d00020!important;border-radius:14px!important;box-shadow:0 18px 44px rgba(90,0,10,.32)!important;padding:10px!important;flex-direction:column!important;gap:6px!important;}
#tabs.section-menu.show{display:flex!important;visibility:visible!important;opacity:1!important;}
#tabs.section-menu .tab{display:block!important;width:100%!important;min-height:42px;color:#5a1820!important;background:#fff8f8!important;text-align:left!important;visibility:visible!important;opacity:1!important;}

</style>

<script>
(() => {
const uid=()=>((globalThis.crypto&&typeof globalThis.crypto.randomUUID==='function')?globalThis.crypto.randomUUID():('id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,11)));
const KEY='cinevault_fresh_v1';
const blank=()=>({items:[],websites:[],channels:[],notes:[],pdf:[],pdfFolders:[],learning:[]});
let db=load(), section='library', editing=null, openedPdfFolder=null;
function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');return x&&Array.isArray(x.items)?{...blank(),...x}:blank()}catch{return blank()}}

const STARTER_KEY=KEY+'_starter_v1';
const starterCatalog = [{"title":"Evandi Avida Vachindi","type":"Movie"},{"title":"Ahwanam","type":"Movie"},{"title":"Aruguru Prativrathalu","type":"Movie"},{"title":"Taj Mahal","type":"Movie"},{"title":"Thali","type":"Movie"},{"title":"Pelli","type":"Movie"},{"title":"Shubalekhalu","type":"Movie"},{"title":"Panchadara Chiluka","type":"Movie"},{"title":"Chala Bagundi","type":"Movie"},{"title":"Chepalani Vundi","type":"Movie"},{"title":"Ma Avida Mida Ottu Mi Avida Chala Manchidi","type":"Movie"},{"title":"Snehithulu","type":"Movie"},{"title":"Ame","type":"Movie"},{"title":"Shubalagnam","type":"Movie"},{"title":"Chusadam Randi","type":"Movie"},{"title":"Avide Shyamala","type":"Movie"},{"title":"Preyasi Rave","type":"Movie"},{"title":"Kanyadanam","type":"Movie"},{"title":"Chirunavutho","type":"Movie"},{"title":"Swayamvaram","type":"Movie"},{"title":"Farzi","type":"Series"},{"title":"The Family Man","type":"Series"},{"title":"Scam 1992","type":"Series"},{"title":"Paatal Lok","type":"Series"},{"title":"Aspirants","type":"Series"},{"title":"The Last of Us","type":"Series"},{"title":"Peaky Blinders","type":"Series"},{"title":"The Boys","type":"Series"},{"title":"The Walking Dead","type":"Series"},{"title":"All of Us Are Dead","type":"Series"},{"title":"Wednesday","type":"Series"},{"title":"Sherlock","type":"Series"},{"title":"How I Met Your Mother","type":"Series"},{"title":"Friends","type":"Series"},{"title":"Breaking Bad","type":"Series"},{"title":"Squid Game","type":"Series"},{"title":"Money Heist","type":"Series"},{"title":"Chernobyl","type":"Series"},{"title":"Dark","type":"Series"},{"title":"Stranger Things","type":"Series"},{"title":"Game of Thrones","type":"Series"},{"title":"House of the Dragon","type":"Series"},{"title":"Mirzapur","type":"Series"},{"title":"Alice in Borderland","type":"Series"},{"title":"Shiddat","type":"Movie"},{"title":"Dil Bechara","type":"Movie"},{"title":"Ae Dil Hai Mushkil","type":"Movie"},{"title":"Barfi!","type":"Movie"},{"title":"Sanam Re","type":"Movie"},{"title":"October","type":"Movie"},{"title":"Laila Majnu","type":"Movie"},{"title":"Succession","type":"Series"},{"title":"Death Note","type":"Anime"},{"title":"Daredevil","type":"Series"},{"title":"The Last Ship","type":"Series"},{"title":"Band of Brothers","type":"Series"},{"title":"Invincible","type":"Series"},{"title":"Arcane","type":"Series"},{"title":"True Detective","type":"Series"},{"title":"Bangalore Days","type":"Movie"},{"title":"Dear Zindagi","type":"Movie"},{"title":"Jab We Met","type":"Movie"},{"title":"Wake Up Sid","type":"Movie"},{"title":"Jaane Tu Ya Jaane Na","type":"Movie"},{"title":"Life in a... Metro","type":"Movie"},{"title":"Piku","type":"Movie"},{"title":"2 States","type":"Movie"},{"title":"I Hate Luv Storys","type":"Movie"},{"title":"Kumbalangi Nights","type":"Movie"},{"title":"Bhaag Milkha Bhaag","type":"Movie"},{"title":"3 Idiots","type":"Movie"},{"title":"Highway","type":"Movie"},{"title":"Tamasha","type":"Movie"},{"title":"Yeh Jawaani Hai Deewani","type":"Movie"},{"title":"Rockstar","type":"Movie"},{"title":"You","type":"Series"},{"title":"Outer Banks (OBX)","type":"Series"},{"title":"The Witcher","type":"Series"},{"title":"Suits","type":"Series"},{"title":"Cobra Kai","type":"Series"},{"title":"Unicen","type":"Series"},{"title":"Lucifer","type":"Series"},{"title":"The Dark Knight","type":"Movie"},{"title":"Inception","type":"Movie"},{"title":"Fight Club","type":"Movie"},{"title":"The Godfather","type":"Movie"},{"title":"Interstellar","type":"Movie"},{"title":"The Shawshank Redemption","type":"Movie"},{"title":"Joker","type":"Movie"},{"title":"The Pursuit of Happyness","type":"Movie"},{"title":"Into the Wild","type":"Movie"},{"title":"The Wolf of Wall Street","type":"Movie"},{"title":"Brahmayugam","type":"Movie"},{"title":"Aavesham","type":"Movie"},{"title":"Kishkindha Kaandam","type":"Movie"},{"title":"Golam","type":"Movie"},{"title":"Eternal","type":"Movie"},{"title":"Avatar","type":"Movie"},{"title":"Jurassic Park","type":"Movie"},{"title":"Vikings","type":"Series"},{"title":"Transformers","type":"Movie"},{"title":"Spider-Man","type":"Movie"},{"title":"Iron Man","type":"Movie"},{"title":"Batman","type":"Movie"},{"title":"Hulk","type":"Movie"},{"title":"Captain America","type":"Movie"},{"title":"Pirates of the Caribbean","type":"Movie"},{"title":"The Avengers","type":"Movie"},{"title":"Gladiator","type":"Movie"},{"title":"Harry Potter","type":"Movie"},{"title":"Charlie","type":"Movie"},{"title":"OK Bangaram","type":"Movie"},{"title":"100 Days of Love","type":"Movie"},{"title":"Fauda","type":"Series"},{"title":"Jack Ryan","type":"Series"}];
try {
  // Always merge the starter catalog by title. This repairs empty libraries from earlier mobile-browser runs
  // without deleting anything the user has already saved.
  const existing=new Set(db.items.map(x=>(x.title||'').trim().toLowerCase()));
  let addedStarter=0;
  for(const entry of starterCatalog){
    const normalized=entry.title.trim().toLowerCase();
    if(existing.has(normalized)) continue;
    db.items.push({id:uid(),title:entry.title,type:entry.type,genre:'',language:'',year:'',imdb:'',poster:'',description:'',personal:'',status:'Want to watch',seasons:'',episodes:[],movieLinks:[],created:Date.now()});
    existing.add(normalized); addedStarter++;
  }
  if(addedStarter || !localStorage.getItem(KEY)) localStorage.setItem(KEY,JSON.stringify(db));
  localStorage.setItem(STARTER_KEY,'1');
} catch(e) { /* If browser storage is unavailable, the app can still be used manually. */ }
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));render();stats();return true}catch(err){console.error('Save failed',err);toast('Save failed: browser storage may be full or blocked. Export a backup and try a smaller poster.');return false}}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safeUrl(u=''){try{let value=String(u||'').trim();if(!value)return '#';if(!/^[a-z][a-z0-9+.-]*:/i.test(value))value='https://'+value;let x=new URL(value);return ['http:','https:'].includes(x.protocol)?x.href:'#'}catch{return '#'}}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function stats(){const f=document.getElementById('filmCount'),l=document.getElementById('linkCount'),n=document.getElementById('noteCount');if(f)f.textContent=db.items.length;if(l)l.textContent=db.websites.length+db.channels.length;if(n)n.textContent=db.notes.length+db.learning.length}
const sectionNames={library:'Films & Series',websites:'Websites',channels:'Channels',notes:'Notes',pdf:'PDFs',learning:'Learning Resources'};
let currentPage=1;const PAGE_SIZE=8;
function setSection(s){section=s;currentPage=1;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.section===s));document.getElementById('genreFilter').classList.toggle('hidden',s!=='library');document.getElementById('sortFilter').classList.toggle('hidden',s!=='library');const addButton=document.getElementById('addBtn');if(addButton){addButton.classList.toggle('hidden',s!=='library');addButton.textContent='＋ Add film / series';}document.getElementById('search').placeholder='Search '+sectionNames[s].toLowerCase()+'…';render()}
function currentQuery(){return document.getElementById('search').value.trim().toLowerCase()}
function render(){
 const root=document.getElementById('content'),q=currentQuery();
 if(section==='library'){
  const commonGenres=['Action','Adventure','Animation','Anime','Biography','Comedy','Crime','Documentary','Drama','Family','Fantasy','History','Horror','Mystery','Romance','Sci-Fi','Sport','Thriller','War','Western'];
  let genres=[...new Set([...commonGenres,...db.items.flatMap(x=>(x.genre||'').split(',').map(g=>g.trim()).filter(Boolean))])].sort((a,b)=>a.localeCompare(b));
  let gf=document.getElementById('genreFilter'),old=gf.value;gf.innerHTML='<option value="">All genres</option>'+genres.map(g=>`<option>${esc(g)}</option>`).join('');gf.value=genres.includes(old)?old:'';
  let arr=db.items.filter(x=>[x.title,x.genre,x.language,x.year,x.type].join(' ').toLowerCase().includes(q)&&(!gf.value||(x.genre||'').toLowerCase().split(',').map(s=>s.trim()).includes(gf.value.toLowerCase())));
  let sort=document.getElementById('sortFilter').value;
  arr.sort((a,b)=>sort==='title'?a.title.localeCompare(b.title):sort==='rating'?(Number(b.imdb)||0)-(Number(a.imdb)||0):sort==='year'?(Number(b.year)||0)-(Number(a.year)||0):(b.created||0)-(a.created||0));
  const totalPages=Math.max(1,Math.ceil(arr.length/PAGE_SIZE));currentPage=Math.min(currentPage,totalPages);const shown=arr.slice((currentPage-1)*PAGE_SIZE,currentPage*PAGE_SIZE);
  root.innerHTML=`<div class="section-head"><h2>Your collection</h2><span class="count">${arr.length} item${arr.length===1?'':'s'}</span></div>`+(arr.length?`<div class="grid">${shown.map(x=>`<article class="poster-card" data-open="${x.id}" tabindex="0" aria-label="Open ${esc(x.title)}"><div class="poster">${x.poster?`<img src="${esc(x.poster)}" alt="${esc(x.title)} poster" onload="this.nextElementSibling.style.display='none'" onerror="this.style.display='none'">`:''}<div class="poster-placeholder"><strong>${esc(x.title)}</strong></div><span class="type-pill">${esc(x.type||'Movie')}</span></div><div class="poster-info"><div class="poster-title">${esc(x.title)}</div><div class="poster-meta">${esc(x.year||'Year n/a')} · ${(x.movieLinks||[]).filter(Boolean).length?`<a class="poster-url" href="${esc(safeUrl((x.movieLinks||[]).filter(Boolean)[0]))}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${esc((x.movieLinks||[]).filter(Boolean)[0])}</a>`:'No URL added'}</div></div></article>`).join('')}</div><div class="pagination"><button class="btn" id="prevPage" ${currentPage===1?'disabled':''}>← Previous</button><span class="page-label">Page ${currentPage} of ${totalPages} · ${shown.length} shown</span><button class="btn" id="nextPage" ${currentPage===totalPages?'disabled':''}>Next →</button></div>`:`<div class="empty"><b>${db.items.length?'No matches found':'Your library starts here'}</b>${db.items.length?'Try another search or genre.':'Add your first film or series. Your collection is saved separately from your old app.'}</div>`);
  } else if(section==='websites'||section==='channels'){
   let arr=db[section].filter(x=>(x.name+' '+x.url).toLowerCase().includes(q));
   root.innerHTML=`<div class="section-head"><h2>${sectionNames[section]}</h2><span class="count">${arr.length} saved</span><button class="btn primary" id="addSectionItem">＋ Add ${section==='websites'?'website':'channel'}</button></div>`+(arr.length?`<div class="list">${arr.map(x=>`<div class="link-row"><div class="name">${esc(x.name)}</div><a href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer">${esc(x.url)}</a><div class="row-actions"><button class="small-btn" data-edit="${section}:${x.id}" title="Edit">✎</button><button class="small-btn" data-delete="${section}:${x.id}" title="Delete">×</button></div></div>`).join('')}</div>`:`<div class="empty"><b>No ${section} saved yet</b>Tap Add to save a name and link.</div>`);
   document.getElementById('addSectionItem').onclick=()=>openForm(section);
  } else if(section==='pdf'){
   let arr=db.pdf.filter(x=>(x.title+' '+(x.folder||'General')).toLowerCase().includes(q));
   const folders=[...new Set([...(db.pdfFolders||[]),...db.pdf.map(x=>((x.folder||'General').trim()||'General'))])].filter(f=>f.toLowerCase().includes(q)).sort((a,b)=>a.localeCompare(b));
   const visibleFolders = openedPdfFolder ? folders.filter(f => f === openedPdfFolder) : folders;
   root.innerHTML = `<div class="section-head"><h2>PDF Library${openedPdfFolder ? ' / '+esc(openedPdfFolder) : ''}</h2><span class="count">${arr.length} saved</span>${openedPdfFolder ? '<button class="btn" id="backPdfFolders">← All folders</button>' : ''}<button class="btn primary" id="addPdfBtn">＋ Create folder</button></div>` + (visibleFolders.length ? (openedPdfFolder ? visibleFolders.map(folder => {
    const filesInFolder = db.pdf.filter(x => ((x.folder || 'General').trim() || 'General') === folder);
    return `<section class="pdf-folder"><h3>📁 ${esc(folder)} <span class="count">${filesInFolder.length} files</span></h3><div class="pdf-rows">${filesInFolder.map(x => `<div class="pdf-row"><span class="pdf-name">📄 ${esc(x.title)}</span>${x.url ? `<a href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer">Open ↗</a>` : x.file ? `<a href="${esc(x.file)}" target="_blank" rel="noopener noreferrer">Open ↗</a>` : ''}<span class="row-actions"><button class="small-btn" data-delete="pdf:${x.id}" aria-label="Delete PDF">×</button></span></div>`).join('') || '<div class="page-label">This folder is empty.</div>'}<div class="pdf-folder-actions"><button class="btn" data-upload-folder="${esc(folder)}">＋ Upload files</button></div></div></section>`;
   }).join('') : folders.map(folder => {
    const filesInFolder = db.pdf.filter(x => ((x.folder || 'General').trim() || 'General') === folder);
    return `<button type="button" class="pdf-folder-tile" data-open-pdf-folder="${esc(folder)}" style="display:block;width:100%;text-align:left;padding:16px;margin:10px 0;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);cursor:pointer"><strong>📁 ${esc(folder)}</strong><span class="count" style="float:right">${filesInFolder.length} files　›</span></button>`;
   }).join('')) : `<div class="empty"><b>No folders yet</b>Tap Create folder to create your first folder.</div>`);
   let pb=document.getElementById('addPdfBtn');if(pb)pb.onclick=()=>createPdfFolder();
   const back=document.getElementById('backPdfFolders');if(back)back.onclick=()=>{openedPdfFolder=null;render()};
   root.querySelectorAll('[data-open-pdf-folder]').forEach(b=>b.onclick=()=>{openedPdfFolder=b.dataset.openPdfFolder;render()});
   root.querySelectorAll('[data-upload-folder]').forEach(b=>b.onclick=()=>uploadPdfsToFolder(b.dataset.uploadFolder));
  } else {
   let arr=db[section].filter(x=>(x.title+' '+(x.body||'')+' '+(x.url||'')).toLowerCase().includes(q));
   const label=section==='notes'?'note':'learning resource';
   root.innerHTML=`<div class="section-head"><h2>${sectionNames[section]}</h2><span class="count">${arr.length} saved</span><button class="btn primary" id="addSectionItem">＋ Add ${label}</button></div>`+(arr.length?`<div class="notes-grid">${arr.map(x=>`<article class="note"><div style="display:flex;justify-content:space-between;gap:8px"><h3>${esc(x.title)}</h3><span><button class="small-btn" data-edit="${section}:${x.id}">✎</button><button class="small-btn" data-delete="${section}:${x.id}">×</button></span></div><p>${esc(x.body||'')}</p>${x.url?`<p style="margin-top:10px"><a style="color:var(--accent2)" href="${esc(safeUrl(x.url))}" target="_blank" rel="noopener noreferrer">${esc(x.url)}</a></p>`:''}</article>`).join('')}</div>`:`<div class="empty"><b>Nothing here yet</b>Tap Add to create your first ${label}.</div>`);
   document.getElementById('addSectionItem').onclick=()=>openForm(section);
  }
}
function field(name,label,type='text',value='',opts={}){let id='f_'+name;let input=type==='textarea'?`<textarea class="field" id="${id}" name="${name}" rows="${opts.rows||3}" ${opts.required?'required':''} placeholder="${esc(opts.placeholder||'')}">${esc(value||'')}</textarea>`:type==='select'?`<select class="field" id="${id}" name="${name}">${opts.options.map(o=>`<option ${o==value?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input class="field" id="${id}" name="${name}" type="${type}" value="${esc(value||'')}" ${opts.required?'required':''} placeholder="${esc(opts.placeholder||'')}">`;return `<div class="form-field ${opts.span?'span2':''}"><label for="${id}">${label}</label>${input}</div>`}
function createPdfFolder(){
 const raw=prompt('Create folder name:');
 if(raw===null)return;
 const folder=raw.trim();
 if(!folder){alert('Please enter a folder name.');return;}
 db.pdfFolders=db.pdfFolders||[];
 if(!db.pdfFolders.some(x=>x.toLowerCase()===folder.toLowerCase()))db.pdfFolders.push(folder);
 persist();openedPdfFolder=folder;render();
}
function uploadPdfsToFolder(folder){
 const input=document.createElement('input');input.type='file';input.accept='application/pdf,.pdf';input.multiple=true;
 input.onchange=async()=>{
  const files=Array.from(input.files||[]);if(!files.length)return;
  const valid=files.filter(f=>f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf'));
  if(!valid.length){alert('Please select PDF files.');return;}
  const tooLarge=valid.filter(f=>f.size>4*1024*1024);
  if(tooLarge.length){alert('Each PDF must be 4 MB or smaller. These were skipped: '+tooLarge.map(f=>f.name).join(', '));}
  let added=0;
  for(const file of valid.filter(f=>f.size<=4*1024*1024)){
   try{const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});
    db.pdf.push({id:uid(),title:file.name.replace(/\\.pdf$/i,''),folder,body:'',url:'',file:data,filename:file.name,created:Date.now()});added++;
   }catch(err){}
  }
  persist();render();if(added)toast(added+' PDF file(s) added to '+folder);else alert('No PDF files were added.');
 };
 input.click();
}
function openForm(target=section,item=null){
 editing=item?{target,item}:null;
 const isFilm=target==='library',isLink=target==='websites'||target==='channels',title=item?'Edit entry':`Add ${({library:'film / series',websites:'website',channels:'channel',notes:'note',pdf:'PDF',learning:'learning resource'}[target])}`;
 document.getElementById('formTitle').textContent=title;
 let f='';
 if(isFilm){let x=item||{};f+=field('title','Title *','text',x.title,{required:true});f+=field('type','Type','select',x.type||'Movie',{options:['Movie','Series','Documentary','Anime','Short Film']});f+=field('genre','Genre(s)','text',x.genre);f+=field('language','Language','text',x.language);f+=field('year','Release year','number',x.year);f+=field('imdb','IMDb rating','number',x.imdb,{placeholder:'e.g. 8.4'});f+=field('poster','Poster image URL (optional)','url',x.poster,{span:true,placeholder:'Paste an image URL, or choose an image file below'});f+='<div class="form-field span2"><label for="f_posterFile">Upload poster image</label><input class="field" id="f_posterFile" name="posterFile" type="file" accept="image/*"><small style="color:var(--muted)">Choose a poster from your phone or computer. Uploaded images are saved with this browser library.</small></div>';f+=field('description','Description','textarea',x.description,{span:true});f+=field('personal','Your rating (optional)','number',x.personal);f+=field('status','Watch status','select',x.status||'Want to watch',{options:['Want to watch','Watching','Watched','On hold']});f+=field('seasons','Seasons (series)','number',x.seasons);f+=field('episodesText','Episodes (one per line: Season | Episode | Title | URL)','textarea',episodesToText(x.episodes),{span:true,rows:5,placeholder:'1 | 1 | Pilot | https://…'});f+=field('movieLinks','Movie / trailer / legal streaming links (one URL per line)','textarea',(x.movieLinks||[]).join('\\n'),{span:true,rows:3});}
 else if(isLink){let x=item||{};f+=field('name','Name *','text',x.name,{required:true});f+=field('url','URL *','url',x.url,{required:true,placeholder:'https://…'});}
 else if(target==='pdf'){let x=item||{};f+=field('title','PDF title *','text',x.title,{required:true});f+=field('folder','Folder name','text',x.folder||'General',{required:true,placeholder:'e.g. College, Certificates, Tutorials'});f+=field('body','Description (optional)','textarea',x.body,{span:true});f+=field('url','PDF link (optional)','url',x.url,{span:true,placeholder:'https://…'});f+=`<div class="form-field span2"><label for="f_pdfFile">Choose PDF from My Files</label><input class="field" id="f_pdfFile" name="pdfFile" type="file" accept="application/pdf,.pdf"><small style="color:var(--muted)">Choose a PDF from Downloads or your phone's Files app (max 4 MB per PDF).</small></div>`;}
 else {let x=item||{};f+=field('title','Title *','text',x.title,{required:true});f+=field('body',target==='notes'?'Note':'What to learn / notes','textarea',x.body,{span:true,rows:5});f+=field('url','Resource URL (optional)','url',x.url,{span:true,placeholder:'https://…'});}
 document.getElementById('formFields').innerHTML=f;
 document.getElementById('entryForm').dataset.target=target;
 document.getElementById('formBackdrop').classList.add('show');
}
function episodesToText(episodes=[]){return episodes.map(e=>[e.season,e.episode,e.title,e.url].join(' | ')).join('\n')}
function parseEpisodes(s){return s.split('\n').map(line=>line.trim()).filter(Boolean).map(line=>{let p=line.split('|').map(x=>x.trim());if(p.length===1)return {season:1,episode:'',title:p[0],url:''};return {season:p[0]||1,episode:p[1]||'',title:p[2]||'Episode',url:p.slice(3).join('|')||''}})}
function openDetails(id){let x=db.items.find(i=>i.id===id);if(!x)return;document.getElementById('detailHeading').textContent=x.title;
let episodes=(x.episodes||[]).map(e=>`<div class="episode"><span>S${esc(e.season)}${e.episode?' · E'+esc(e.episode):''} — ${esc(e.title)}</span>${e.url?`<a href="${esc(safeUrl(e.url))}" target="_blank" rel="noopener noreferrer">Open link ↗</a>`:''}</div>`).join('');
let links=(x.movieLinks||[]).map((u,i)=>`<div class="episode"><span>Link ${i+1}</span><a href="${esc(safeUrl(u))}" target="_blank" rel="noopener noreferrer">Open ↗</a></div>`).join('');
document.getElementById('detailBody').innerHTML=`<div class="detail-layout"><div>${x.poster?`<img class="detail-poster" src="${esc(x.poster)}" alt="">`:`<div class="detail-poster" style="display:grid;place-items:center;padding:10px;text-align:center">${esc(x.title)}</div>`}</div><div class="detail-info"><h2>${esc(x.title)}</h2><div class="chips">${[x.type,x.year,x.language,x.genre].filter(Boolean).map(v=>`<span class="chip">${esc(v)}</span>`).join('')}</div><p class="detail-description">${esc(x.description||'No description added.')}</p>${(x.movieLinks||[]).length?`<p class="detail-link">🔗 <a href="${esc(safeUrl(x.movieLinks[0]))}" target="_blank" rel="noopener noreferrer">${esc(x.movieLinks[0])}</a></p>`:''}<p>⭐ IMDb: <b>${esc(x.imdb||'Not added')}</b> &nbsp; · &nbsp; Your rating: <b>${esc(x.personal||'—')}</b><br>Status: ${esc(x.status||'Not set')} ${x.seasons?' · '+esc(x.seasons)+' season(s)':''}</p></div></div><div class="detail-actions"><button class="btn" id="detailEdit">Edit details</button><button class="btn" id="detailDelete">Delete film</button></div>${episodes?`<div class="episode-block"><h3>Episodes</h3>${episodes}</div>`:''}${links?`<div class="episode-block"><h3>Saved links</h3>${links}</div>`:''}`;
document.getElementById('detailEdit').onclick=()=>{document.getElementById('detailBackdrop').classList.remove('show');openForm('library',x)};
document.getElementById('detailDelete').onclick=()=>deleteItem('library',id);
document.getElementById('detailBackdrop').classList.add('show')}
function deleteItem(target,id){if(!confirm('Delete this item permanently? This cannot be undone.'))return;const bucket=target==='library'?'items':target;if(!Array.isArray(db[bucket]))db[bucket]=[];db[bucket]=db[bucket].filter(x=>x.id!==id);persist();document.getElementById('detailBackdrop').classList.remove('show');toast('Item deleted after confirmation')}
function imageFileToDataUrl(file){return new Promise((resolve,reject)=>{if(!file||!file.type.startsWith('image/')){reject(new Error('Please select a valid image'));return}const reader=new FileReader();reader.onerror=()=>reject(new Error('Could not read the selected image'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('This image format could not be opened'));img.onload=()=>{try{const make=(max,quality)=>{const scale=Math.min(1,max/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Image processing unavailable');ctx.drawImage(img,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',quality)};let data=make(320,0.5);if(data.length>120000)data=make(240,0.38);if(data.length>160000){reject(new Error('Could not reduce this image enough. Please choose a smaller image.'));return}resolve(data)}catch(err){reject(err)}};img.src=reader.result};reader.readAsDataURL(file)})}
document.getElementById('entryForm').addEventListener('submit',async e=>{e.preventDefault();try{let target=e.currentTarget.dataset.target,fd=new FormData(e.currentTarget),v=Object.fromEntries(fd.entries()),old=editing?.item;
if(target==='library' && v.posterFile && v.posterFile.size){try{v.poster=await imageFileToDataUrl(v.posterFile)}catch(err){alert('Could not load that poster image. Please try another image.');return}}
if(target==='pdf' && v.pdfFile && v.pdfFile.size){if(v.pdfFile.size>4*1024*1024){alert('Please choose a PDF smaller than 4 MB, or use a PDF URL.');return}if(v.pdfFile.type!=='application/pdf'&&!v.pdfFile.name.toLowerCase().endsWith('.pdf')){alert('Please choose a PDF file.');return}try{v.file=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(v.pdfFile)});v.filename=v.pdfFile.name}catch(err){alert('Could not read PDF.');return}}
let record;
if(target==='library'){record={id:old?.id||uid(),title:v.title.trim(),type:v.type,genre:v.genre.trim(),language:v.language.trim(),year:v.year,imdb:v.imdb,poster:(v.poster||'').trim(),description:v.description.trim(),personal:v.personal,status:v.status,seasons:v.seasons,episodes:parseEpisodes(v.episodesText||''),movieLinks:(v.movieLinks||'').split('\n').map(s=>s.trim()).filter(Boolean),created:old?.created||Date.now()};}
else if(target==='websites'||target==='channels')record={id:old?.id||uid(),name:v.name.trim(),url:v.url.trim()};
else if(target==='pdf')record={id:old?.id||uid(),title:v.title.trim(),folder:(v.folder||'General').trim()||'General',body:(v.body||'').trim(),url:(v.url||'').trim(),file:v.file||old?.file||'',filename:v.filename||old?.filename||'',created:old?.created||Date.now()};
else record={id:old?.id||uid(),title:v.title.trim(),body:v.body.trim(),url:(v.url||'').trim(),created:old?.created||Date.now()};
const bucket=target==='library'?'items':target;if(!Array.isArray(db[bucket]))db[bucket]=[];if(old){let i=db[bucket].findIndex(z=>z.id===old.id);if(i>=0)db[bucket][i]=record;else db[bucket].push(record)}else db[bucket].push(record);
const saved=persist();if(!saved){if(old){let i=db[bucket].findIndex(z=>z.id===record.id);if(i>=0)db[bucket][i]=old}else db[bucket]=db[bucket].filter(z=>z.id!==record.id);return}document.getElementById('formBackdrop').classList.remove('show');editing=null;toast(old?'Changes saved':'New item added — existing items kept')}catch(err){console.error('Save button failed:',err);alert('Save could not complete: '+(err&&err.message?err.message:'unexpected error')+'. Your existing saved items have not been intentionally cleared. Please export a backup before retrying.')}});
const addButton=document.getElementById('addBtn');if(addButton)addButton.onclick=()=>openForm('library');
document.querySelectorAll('.tab[data-section]').forEach(b=>b.onclick=()=>{setSection(b.dataset.section)});
document.getElementById('search').addEventListener('input',()=>{currentPage=1;render()});document.getElementById('genreFilter').addEventListener('change',()=>{currentPage=1;render()});document.getElementById('sortFilter').addEventListener('change',()=>{currentPage=1;render()});
document.getElementById('content').addEventListener('click',e=>{if(e.target.id==='prevPage'){currentPage=Math.max(1,currentPage-1);render()}if(e.target.id==='nextPage'){currentPage++;render()}});
document.getElementById('content').addEventListener('click',e=>{let card=e.target.closest('[data-open]');if(card)openDetails(card.dataset.open);let ed=e.target.closest('[data-edit]');if(ed){let [t,id]=ed.dataset.edit.split(':');openForm(t,db[t].find(x=>x.id===id))}let del=e.target.closest('[data-delete]');if(del){let [t,id]=del.dataset.delete.split(':');deleteItem(t,id)}});
document.getElementById('content').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-open]'))openDetails(e.target.dataset.open)});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).classList.remove('show'));
['formBackdrop','detailBackdrop'].forEach(id=>document.getElementById(id).addEventListener('click',e=>{if(e.target.id===id)e.target.classList.remove('show')}));
document.getElementById('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify({app:'All in One',version:2,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='All-in-One-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let parsed=JSON.parse(await file.text()),incoming=parsed.data||parsed;if(!incoming||!Array.isArray(incoming.items))throw Error('This is not a CineVault backup.');if(!confirm('Import will MERGE new records with this library. Existing records will not be removed. Continue?'))return;
let added=0,skipped=0;db.pdfFolders=[...new Set([...(db.pdfFolders||[]),...(Array.isArray(incoming.pdfFolders)?incoming.pdfFolders:[])])];for(let k of ['items','websites','channels','notes','pdf','learning']){if(!Array.isArray(incoming[k]))continue;let existing=db[k];for(let item of incoming[k]){let key=k==='items'?(item.title||'').trim().toLowerCase():((item.name||item.title||'').trim().toLowerCase()+'|'+(item.url||''));let duplicate=existing.some(z=>(k==='items'?(z.title||'').trim().toLowerCase():((z.name||z.title||'').trim().toLowerCase()+'|'+(z.url||'')))===key);if(duplicate){skipped++;continue}existing.push({...item,id:uid(),created:item.created||Date.now()});added++}}persist();toast(`Import complete: ${added} added, ${skipped} duplicates skipped`)}catch(err){alert('Import failed: '+err.message)}finally{e.target.value=''}};
if(addButton)addButton.classList.remove('hidden');document.getElementById('tabs').classList.add('show');render();stats();
})();
</script>

<style id="all-in-one-classic-red-white">
/* Classic All in One red-and-white layout: no hamburger dropdown. */
header{position:static;align-items:center}
.header-actions{margin-left:auto;display:flex;align-items:center;justify-content:flex-end;gap:7px}
.menu-toggle{display:none!important}
.tabs,.tabs.show{display:flex!important;position:static!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;width:100%;max-height:none;overflow-x:auto;overflow-y:visible;flex-direction:row;flex-wrap:wrap;gap:6px;margin:12px 0 16px;padding:10px;background:#fffafa;border:1px solid #efd4d7;border-radius:14px;box-shadow:none}
.tabs .tab{display:block!important;visibility:visible!important;opacity:1!important;width:auto;text-align:center;background:#fff;color:#7d6568;border:1px solid #efd4d7;padding:9px 11px;border-radius:10px;white-space:nowrap}
.tabs .tab.active{background:#d00020;color:#fff;border-color:#d00020}
.tabs .menu-action{background:#fff5f5;color:#bd001d}
@media(max-width:520px){header{gap:10px}.header-actions{width:100%;margin-left:0}.header-actions .btn{flex:1}.tabs,.tabs.show{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tabs .tab{white-space:normal;padding:9px 5px;font-size:12px}}
</style>
<style id="pdf-folders-and-add-actions">
.pdf-folder{margin:14px 0 20px;padding:12px;border:1px solid #efd4d7;border-radius:14px;background:#fffafa}
.pdf-folder h3{margin:0 0 10px;color:#b90020;font-size:16px;display:flex;align-items:center;gap:8px}
.pdf-rows{display:flex;flex-direction:column;gap:7px}
.pdf-row{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 10px;background:#fff;border:1px solid #f0dfe1;border-radius:10px;min-width:0}
.pdf-name{flex:1;min-width:0;overflow-wrap:anywhere;font-size:14px;color:#3b2024}
.pdf-row>a{white-space:nowrap;color:#c40020;font-size:13px}
.pdf-row .row-actions{display:flex;gap:4px;flex-shrink:0}
.section-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.section-head h2{margin-right:auto}
@media(max-width:520px){.pdf-row{gap:6px;padding:7px}.pdf-name{font-size:12px}.pdf-row>a{font-size:12px}.section-head .btn{font-size:13px;padding:9px 10px}}
</style>
</body>
</html>
